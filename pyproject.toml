[project]
name = "seamtech-search"
version = "0.4.0"
description = "Fast, secure search and indexing engine for technical fabrication files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.11.7",
    "pypdf==6.19.0",
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "reportlab==4.4.3",
    "openpyxl==3.1.5",
    "boto3==1.35.90",
    "redis==5.2.1",
    "psycopg2-binary==2.9.10",
]

# Mirrors requirements-dev.txt exactly. tests/test_requirements_consistency.py
# enforces that these two lists (and requirements.txt vs [project].dependencies)
# cannot drift apart again — that drift is how pytest ended up pinned at both
# 8.4.1 and 9.1.1 in the same repository.
[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff>=0.5.0",
    "pip-audit>=2.7.0",
    "PyYAML==6.0.3",
    "pglast==8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "postgres: tests requiring a live PostgreSQL instance",
    "s3: tests requiring a live S3 or MinIO instance",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
