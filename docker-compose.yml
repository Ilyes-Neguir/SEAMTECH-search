# Rotation des journaux bornée (Lot H.1) : chaque conteneur est limité à
# 5 fichiers de 10 Mo — un service bavard ne peut plus remplir le disque.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # Image pgvector (Lot A) : fournit PostgreSQL 16 + l'extension `vector`
    # requise par la couche métier « fiches » (migration 006). unaccent reste
    # disponible (contrib inclus dans l'image).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: seamtech_search
      POSTGRES_USER: seamtech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports:
      # Bound to loopback interface 127.0.0.1 by default for security.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seamtech -d seamtech_search"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # MinIO removed minio/minio from Docker Hub on 2026-09-11 (anonymous
    # pulls now 404/401); quay.io/minio is their current official
    # distribution with the same tags.
    #
    # Pinned to an explicit release rather than :latest. Checked against the
    # quay.io tag list on 2026-09-18: `latest`, `latest-cicd` and
    # RELEASE.2025-09-07T16-13-09Z are all the SAME manifest digest
    # (sha256:14cea493d9a3...), so this pin does not move the version under
    # test -- it only makes it immutable and reproducible. MinIO's community
    # tags stopped advancing when the project went source-only; the newer
    # `.hotfix.*` tags on quay.io come from the paid stream and are
    # deliberately not used here.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the environment}
    ports:
      # S3 API endpoint
      - "127.0.0.1:9000:9000"
      # MinIO Web Console
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    # `mc ready local` is MinIO's own documented in-container healthcheck
    # (docs/orchestration/docker-compose/docker-compose.yaml) and the one its
    # maintainers direct people to: the server image ships `mc` with a
    # pre-configured `local` alias but has no curl/wget, so an HTTP probe from
    # inside the container is not possible. /minio/health/* is for callers
    # OUTSIDE the container, which is what the CI integration job's Python
    # probe uses against 127.0.0.1:9000.
    #
    # This replaces `test -d /proc/1`, which could never fail: it proved PID 1
    # existed, not that the S3 API could serve a request. The `web` service
    # waits on `condition: service_healthy`, so a real probe means the API no
    # longer starts against an object store that is up but not ready.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in the environment}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the environment}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build: .
    restart: unless-stopped
    logging: *default-logging
    environment:
      SEAMTECH_DATABASE_URL: postgresql://seamtech:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}@postgres:5432/seamtech_search
      SEAMTECH_STORAGE_BACKEND: "s3"
      SEAMTECH_S3_ENDPOINT_URL: "http://minio:9000"
      SEAMTECH_S3_BUCKET: ${SEAMTECH_S3_BUCKET:-seamtech-documents}
      SEAMTECH_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the environment}
      SEAMTECH_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the environment}
      SEAMTECH_REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in the environment}@redis:6379/0"
      # Inside the container network, web listens on 0.0.0.0 so frontend can communicate.
      SEAMTECH_HOST: "0.0.0.0"
      SEAMTECH_ALLOW_NETWORK_ACCESS: "true"
      # The documented office deployment is served through a TLS terminator.
      # Override to false only when the service is strictly localhost-only.
      #
      # This default MUST stay true. create_app() refuses to start when
      # host is not loopback, an auth token is set, and behind_tls_proxy is
      # false:
      #   raise ValueError("token authentication over non-local host
      #                     requires behind_tls_proxy=true")
      # The container listens on 0.0.0.0 so `frontend` can reach it over the
      # compose network (it is published only on 127.0.0.1 below), so with a
      # token configured this guard always applies. Flipping the default to
      # false made web raise inside create_app() -- before uvicorn started --
      # so the container exited, never became healthy, and
      # `docker compose up -d web frontend` failed with "dependency failed to
      # start". Note the frontend service below deliberately defaults this to
      # false; see the comment there. The two are not a typo to harmonise.
      SEAMTECH_BEHIND_TLS_PROXY: ${SEAMTECH_BEHIND_TLS_PROXY:-true}
      SEAMTECH_AUTH_TOKEN: ${SEAMTECH_AUTH_TOKEN:?Set SEAMTECH_AUTH_TOKEN in the environment}
      SEAMTECH_ROOT_PATHS: ${SEAMTECH_ROOT_PATHS:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Bound to loopback interface 127.0.0.1 by default.
      # Direct LAN exposure requires TLS termination (see docs/TLS.md).
      - "127.0.0.1:8000:8000"
    volumes:
      - ./sample_data:/app/sample_data:ro
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health', headers={'X-SEAMTECH-TOKEN': os.environ['SEAMTECH_AUTH_TOKEN']}); urllib.request.urlopen(request, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Server-side only (frontend/lib/backend.ts) — never sent to the browser.
      SEAMTECH_API_URL: http://web:8000
      SEAMTECH_AUTH_TOKEN: ${SEAMTECH_AUTH_TOKEN:?Set SEAMTECH_AUTH_TOKEN in the environment}
      # UI sign-in (frontend/lib/auth.ts). Audit issue #5, Option B: the
      # frontend used to forward SEAMTECH_AUTH_TOKEN for anyone who could reach
      # it, with no login at all. SEAMTECH_UI_PASSWORD is the single shared
      # operator password; SEAMTECH_SESSION_SECRET signs the httpOnly session
      # cookie. Both are required — with no password configured the login
      # endpoint fails closed (503) rather than letting everyone in.
      SEAMTECH_UI_PASSWORD: ${SEAMTECH_UI_PASSWORD:?Set SEAMTECH_UI_PASSWORD in the environment}
      SEAMTECH_SESSION_SECRET: ${SEAMTECH_SESSION_SECRET:?Set SEAMTECH_SESSION_SECRET in the environment}
      SEAMTECH_SESSION_HOURS: ${SEAMTECH_SESSION_HOURS:-12}
      # Marks the session cookie Secure when a TLS terminator is in front.
      #
      # Deliberately defaults to false here while `web` above defaults to true.
      # shouldMarkCookieSecure() (frontend/lib/auth.ts) also honours
      # SEAMTECH_SECURE_COOKIES and the request's own x-forwarded-proto, so TLS
      # deployments still get Secure cookies -- but the default compose
      # deployment publishes on loopback over plain HTTP, where a Secure cookie
      # would be dropped by the browser and sign-in (audit issue #5) would not
      # work at all. web's flag gates a different thing: whether token auth may
      # run on a non-loopback bind. Set SEAMTECH_BEHIND_TLS_PROXY explicitly to
      # give both services the same value.
      SEAMTECH_BEHIND_TLS_PROXY: ${SEAMTECH_BEHIND_TLS_PROXY:-false}
    depends_on:
      web:
        condition: service_healthy
    ports:
      # Bound to loopback interface 127.0.0.1 by default.
      - "127.0.0.1:3000:3000"
    healthcheck:
      # /api/health is the one unauthenticated route: it answers with a static
      # liveness payload (no archive counts) so this probe keeps working
      # without a session cookie. See frontend/app/api/health/route.ts.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional reverse proxy for TLS termination (Caddy) — uncomment when deploying behind TLS
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config

volumes:
  postgres-data:
  minio-data:
  redis-data:
  # caddy-data:
  # caddy-config:
