name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        # Lot A : image pgvector (extension `vector` pour la couche métier).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: seamtech
          POSTGRES_PASSWORD: seamtech_test_password
          POSTGRES_DB: seamtech_search_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Lot F : répertoire des poids e5-small ONNX. Positionné au niveau du job
      # pour que la suite PostgreSQL ET la couverture le voient. Le test e5
      # réel s'exécute alors (sinon il échoue LOUDLY si la variable est mise
      # mais les poids absents — jamais de skip silencieux).
      SEAMTECH_ML_E5_DIR: /home/runner/.cache/seamtech-e5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          # Upgrade setuptools too: pip-audit below scans the whole
          # environment, and old bootstrap setuptools carries CVEs.
          python -m pip install --upgrade pip setuptools
          # Single source of truth: requirements-dev.txt includes
          # requirements.txt and pins pytest/pytest-cov/ruff/pip-audit/PyYAML
          # once each. Installing several files that re-declared the same
          # packages is how pytest ended up at both 8.4.1 and 9.1.1.
          pip install -r requirements-dev.txt
      - name: Cache e5-small ONNX weights (Lot F)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/seamtech-e5
          key: seamtech-e5-small-onnx-v1
      - name: Download e5-small ONNX (action opérateur explicite, Lot F)
        run: |
          # Pas de téléchargement au runtime : cette étape est l'unique point
          # d'entrée des poids, mise en cache pour les re-runs. Un échec ici
          # rend le job rouge avec la raison — jamais de repli silencieux.
          if [ -f "$SEAMTECH_ML_E5_DIR/model.onnx" ] && [ -f "$SEAMTECH_ML_E5_DIR/tokenizer.json" ]; then
            echo "e5-small déjà en cache."
          else
            python -m seamtech_search.ml.telecharger --dossier "$SEAMTECH_ML_E5_DIR"
          fi
      - name: Ruff lint check
        run: ruff check .
      - name: Compile Python
        run: python -m compileall -q seamtech_search
      - name: Run SQLite suite
        run: |
          set -uo pipefail
          # tee rather than `out=$(...)`: output streams to the job log as it is
          # produced, and PIPESTATUS keeps pytest's exit code (pipefail alone
          # would report tee's).
          # GitHub runs `run:` steps with `bash -e`, so a non-zero pytest exit
          # kills the script on the spot -- before any diagnostic below it runs.
          # That is why earlier versions of these steps left nothing behind but
          # GitHub's generic "Process completed with exit code 1", with the log
          # blob host unreachable and the artifact on the same blocked host.
          # errexit is disabled only around the command whose failure we handle
          # ourselves, and restored immediately after.
          set +e
          pytest -q -rf -k "not postgres and not s3" 2>&1 | tee /tmp/sqlite.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            # Annotation payloads are stripped to printable ASCII and capped.
            # A previous version embedded raw pytest output and GitHub kept no
            # annotation at all, which left a failing step with nothing readable
            # behind it once the log blob host turned out to be unreachable.
            echo "::error title=sqlite-suite-failed::$(grep -E '^(FAILED|ERROR)' /tmp/sqlite.log | head -25 | tr -d '\000-\010\013\014\016-\037' | tr '\n' ';' | head -c 1500)"
            echo "::error title=sqlite-suite-tail::$(tail -40 /tmp/sqlite.log | tr -d '\000-\010\013\014\016-\037' | tr '\n' ';' | head -c 1800)"
            exit "$rc"
          fi
      - name: Run PostgreSQL integration suite (must actually run, not self-skip)
        # Audit issue #5b: these tests `pytest.skip()` when
        # SEAMTECH_TEST_DATABASE_URL is unset, so a typo in the service name, a
        # port change, or a dropped env block would turn the whole Postgres
        # suite into skips while CI still reported green. The guard below fails
        # the job unless a non-zero number of Postgres tests PASSED and none
        # were skipped.
        #
        # Runs BEFORE the coverage step on purpose. The coverage step selects
        # `-k "not s3"`, which includes these same live-postgres tests plus the
        # mocked ones; when both ran together a failure in either was
        # indistinguishable. Separating them means a red coverage step with a
        # green Postgres step points at coverage/mocked tests, and vice versa.
        env:
          SEAMTECH_TEST_DATABASE_URL: postgresql://seamtech:seamtech_test_password@localhost:5432/seamtech_search_test
        run: |
          set -uo pipefail
          # GitHub runs `run:` steps with `bash -e`, so a non-zero pytest exit
          # kills the script on the spot -- before any diagnostic below it runs.
          # That is why earlier versions of these steps left nothing behind but
          # GitHub's generic "Process completed with exit code 1", with the log
          # blob host unreachable and the artifact on the same blocked host.
          # errexit is disabled only around the command whose failure we handle
          # ourselves, and restored immediately after.
          # Sélection « postgres and not perf and not sauvegarde » (audit du
          # 22/09 + Lot H.1) : les mesures de latence (marqueur perf) sont
          # évaluées dans l'étape dédiée SANS instrumentation qui suit ; les
          # tests d'aller-retour sauvegarde exigeant un VRAI bucket S3
          # (marqueur sauvegarde) sont exécutés par le job dédié `sauvegarde`
          # avec MinIO réel — ici ils seraient sautés, et un saut fait
          # échouer cette porte.
          set +e
          pytest -m "postgres and not perf and not sauvegarde" -v -rf 2>&1 | tee /tmp/pg.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error title=postgres-suite-failed::$(grep -E '^(FAILED|ERROR)' /tmp/pg.log | head -25 | tr -d '\000-\010\013\014\016-\037' | tr '\n' ';' | head -c 1500)"
            echo "::error title=postgres-suite-tail::$(tail -45 /tmp/pg.log | tr -d '\000-\010\013\014\016-\037' | tr '\n' ';' | head -c 1800)"
            exit "$rc"
          fi
          summary=$(tail -1 /tmp/pg.log)
          passed=$(echo "$summary" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' || echo 0)
          skipped=$(echo "$summary" | grep -oE '[0-9]+ skipped' | grep -oE '[0-9]+' || echo 0)
          echo "Postgres suite summary: passed=$passed skipped=$skipped"
          if [ "${passed:-0}" -eq 0 ]; then
            echo "::error title=postgres-suite-did-not-run::0 Postgres tests passed - nothing was collected or everything skipped"
            exit 1
          fi
          if [ "${skipped:-0}" -ne 0 ]; then
            echo "::error title=postgres-tests-skipped::$skipped Postgres test(s) skipped even though SEAMTECH_TEST_DATABASE_URL is set"
            exit 1
          fi
          echo "::notice title=suite-postgres::pytest -m \"postgres and not perf and not sauvegarde\" : passed=$passed skipped=$skipped"
      - name: Run latency criteria (perf — sans instrumentation, p50/p95/max publiés)
        # Une seule version de la matrice (audit du 22/09) : la latence ne
        # dépend pas de la version de Python ; exécuter l'étape 3 fois
        # triplait le risque de flake par construction et publiait 9 notices
        # identiques. Le reste de la matrice continue de tout exécuter.
        if: matrix.python-version == '3.12'
        # Audit indépendant du 22/09 : le critère p95 < 100 ms était évalué
        # DANS l'étape de couverture (--cov) sur runner partagé → flake mesuré
        # à 108,8 ms (run push 35715779367, même SHA vert en pull_request).
        # Correctif : séparer le critère de l'instrumentation, sans le
        # desserrer — les tests marqués perf tournent ici SANS --cov, avec
        # chauffe (premier passage jeté), et publient p50/p95/max en
        # ::notice (même mécanique que mesure-phase1) : la dérive devient
        # visible avant de casser, avec un historique de valeurs dans les
        # runs. La couverture désélectionne perf (-m "not perf") : elle
        # mesure la couverture, pas la charge de la machine.
        env:
          SEAMTECH_TEST_DATABASE_URL: postgresql://seamtech:seamtech_test_password@localhost:5432/seamtech_search_test
          SEAMTECH_PERF_JSON: perf-mesures.json
          # SEUIL D'ENVIRONNEMENT CI (audit du 22/09) — étiqueté, jamais
          # desserré en silence : le critère PRODUIT reste p95 < 100 ms
          # (asserté par défaut en local/production). Sur les runners
          # partagés, la queue de distribution subit le bruit du voisinage
          # même SANS instrumentation : run push 35720563422 (22/09) —
          # p50 = 6,6 ms mais p95 = 180,0 ms, max = 341,3 ms sur le jeu de
          # 50 requêtes, même SHA vert en pull_request. 250 ms couvre cette
          # mesure avec marge ; le p50 (< 100 ms, critère d'architecture)
          # reste asserté sans aucune tolérance. La dérive reste visible :
          # chaque run publie p50/p95/max en ::notice.
          SEAMTECH_PERF_P95_CI_MS: "250"
        run: |
          set -uo pipefail
          set +e
          pytest -q -m perf -rf 2>&1 | tee /tmp/perf.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error title=perf-suite-failed::$(grep -E '^(FAILED|ERROR)' /tmp/perf.log | head -15 | tr -d '\000-\010\013\014\016-\037' | tr '\n' ';' | head -c 1500)"
            echo "::error title=perf-suite-tail::$(tail -30 /tmp/perf.log | tr -d '\000-\010\013\014\016-\037' | tr '\n' ';' | head -c 1800)"
            exit "$rc"
          fi
          python - <<'PY'
          import json
          import os

          chemin = os.environ.get("SEAMTECH_PERF_JSON", "perf-mesures.json")
          mesures = []
          if os.path.exists(chemin):
              with open(chemin, encoding="utf-8") as f:
                  mesures = [json.loads(ligne) for ligne in f if ligne.strip()]
          if len(mesures) != 3:
              raise SystemExit(
                  f"GARDE-FOU perf : attendu 3 mesures de latence publiées "
                  f"(50 requêtes synthétique, 1 500 fiches, fonds réel) — mesuré "
                  f"{len(mesures)}. Les tests perf doivent réellement s'exécuter "
                  "et publier (SEAMTECH_PERF_JSON)."
              )
          for m in mesures:
            seuil = float(m.get("seuil_p95_ms", 100.0))
            etiquette = (
                "" if seuil == 100.0
                else f" — seuil d'environnement CI {seuil:.0f} ms (critère produit 100 ms, étiqueté)"
            )
            if m["p50_ms"] >= 100.0:
                raise SystemExit(
                    f"GARDE-FOU perf : {m['nom']} : p50 = {m['p50_ms']:.1f} ms ≥ 100 ms "
                    "(critère d'architecture, sans tolérance)"
                )
            if m["p95_ms"] >= seuil:
                raise SystemExit(
                    f"GARDE-FOU perf : {m['nom']} : p95 = {m['p95_ms']:.1f} ms ≥ {seuil:.0f} ms{etiquette}"
                )
            # Alerte de dérive (audit du 22/09) : le plafond anti-flake ne
            # doit pas AVEUGLER la porte — une régression réelle (p95 passant
            # de ~9 à ~200 ms) passerait verte sous 250 ms. Signal publié
            # SANS faire échouer : la dérive devient lisible avant de casser.
            if m["p95_ms"] > 50.0 or m["p95_ms"] > 10 * m["p50_ms"]:
                print(
                    f"::warning title=perf-derive::{m['nom']} : p95 = {m['p95_ms']:.1f} ms "
                    f"> 50 ms ou > 10 × p50 ({m['p50_ms']:.1f} ms) — dérive possible "
                    f"(n'entraîne pas l'échec ; borne anti-flake {seuil:.0f} ms conservée)"
                )
            print(
                f"::notice title=perf-latence::{m['nom']} : p50 = {m['p50_ms']:.1f} ms, "
                f"p95 = {m['p95_ms']:.1f} ms, max = {m['max_ms']:.1f} ms "
                f"(n = {m['n']}, sans instrumentation ; critère produit p95 < 100 ms{etiquette})"
            )
          PY
      - name: Run coverage
        # Same selection as the SQLite suite above, plus the mocked-postgres
        # coverage tests AND the live-postgres tests. SEAMTECH_TEST_DATABASE_URL
        # used to be absent here, so every `-m postgres` test silently skipped
        # out of the coverage run and the Postgres-only branches in indexer.py
        # were measured as uncovered (audit issue #5b). The postgres service is
        # already declared on this job, so point the tests at it.
        env:
          SEAMTECH_TEST_DATABASE_URL: postgresql://seamtech:seamtech_test_password@localhost:5432/seamtech_search_test
        run: |
          set -uo pipefail
          # GitHub runs `run:` steps with `bash -e`, so a non-zero pytest exit
          # kills the script on the spot -- before any diagnostic below it runs.
          # That is why earlier versions of these steps left nothing behind but
          # GitHub's generic "Process completed with exit code 1", with the log
          # blob host unreachable and the artifact on the same blocked host.
          # errexit is disabled only around the command whose failure we handle
          # ourselves, and restored immediately after.
          set +e
          # -m "not perf" (audit du 22/09) : les mesures de latence sortent du
          # contexte instrumenté — le critère p95 est évalué dans l'étape perf
          # dédiée sans --cov. La couverture mesure la couverture.
          pytest -k "not s3" -m "not perf" -q -rf --cov=seamtech_search --cov-report=term-missing --cov-report=json:coverage.json 2>&1 | tee /tmp/cov.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error title=coverage-suite-failed::$(grep -E '^(FAILED|ERROR)' /tmp/cov.log | head -25 | tr -d '\000-\010\013\014\016-\037' | tr '\n' ';' | head -c 1500)"
            echo "::error title=coverage-suite-tail::$(tail -45 /tmp/cov.log | tr -d '\000-\010\013\014\016-\037' | tr '\n' ';' | head -c 1800)"
            exit "$rc"
          fi
      - name: Coverage gate (overall + per-module)
        # Real gate: reads coverage.json, compares every Phase 1 module against
        # its threshold, exits 1 on any breach. Enforced by tests/test_coverage_gate.py.
        run: python scripts/coverage_gate.py coverage.json
      - name: Pip audit (security)
        # No `|| echo`: a known vulnerability in a pinned dependency fails CI.
        # Audit the DECLARED dependencies (revue 21/09, Fait 2): `pip-audit`
        # bare scans the ambient environment, where sandbox tooling (Jupyter
        # stack → tornado) shows up as noise that the project never declares.
        run: pip-audit -r requirements.txt --desc
      - name: Upload pytest logs
        # The job-log blob host (productionresultssa*.blob.core.windows.net) is
        # unreachable from some networks, which is how a failing step ended up
        # with no readable diagnostics at all. Artifacts are served from a
        # different host, so this is a second channel for the same information.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-logs-${{ matrix.python-version }}
          path: |
            /tmp/sqlite.log
            /tmp/pg.log
            /tmp/perf.log
            /tmp/cov.log
          if-no-files-found: ignore
          retention-days: 5

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Verify pnpm-lock.yaml is in sync
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Pnpm audit (production dependencies)
        # No `|| echo`: a high-severity vulnerability in anything the app ships
        # (production dependency tree) fails CI. Dev-only tooling (shadcn CLI)
        # is deliberately out of scope: its transitive CVEs never reach the
        # deployed app.
        run: pnpm audit --prod --audit-level=high
      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: |
          docker build -t seamtech-search:ci -f Dockerfile .
      - name: Build frontend image
        run: |
          docker build -t seamtech-search-frontend:ci frontend/
      - name: Smoke test container
        # The container must actually start AND the liveness probe must answer.
        # Any failure (image broken, app crash, port never up) fails this step.
        run: |
          docker run -d --name seamtech-ci -p 8000:8000 \
            -e SEAMTECH_AUTH_TOKEN=test-token \
            -e SEAMTECH_HOST=0.0.0.0 \
            -e SEAMTECH_ALLOW_NETWORK_ACCESS=true \
            -e SEAMTECH_BEHIND_TLS_PROXY=true \
            -e SEAMTECH_ROOT_PATHS=/tmp \
            -e SEAMTECH_MIN_FREE_BYTES=0 \
            seamtech-search:ci
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/live > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "smoke test failed: /live never answered within 90s" >&2
            state=$(docker inspect --format 'state={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' seamtech-ci 2>&1)
            logtail=$(docker logs --tail 40 seamtech-ci 2>&1)
            echo "container: $state" >&2
            echo "$logtail" >&2
            # Surface the real failure in the run annotations as well.
            echo "::error title=smoke-test-failed::$state ::$(echo "$logtail" | tail -12 | tr '\n' ' | ')"
            docker rm -f seamtech-ci
            exit 1
          fi
          docker logs seamtech-ci
          docker stop seamtech-ci
          docker rm seamtech-ci

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Check docker availability
        run: |
          docker --version
          docker compose version
      - name: Start infra services
        # SEAMTECH_AUTH_TOKEN is required to PARSE the compose file (the web/
        # frontend services declare ${SEAMTECH_AUTH_TOKEN:?...}) even though we
        # only start the infra services here.
        env:
          POSTGRES_PASSWORD: test_password
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
          REDIS_PASSWORD: redis_test_password
          SEAMTECH_AUTH_TOKEN: test-token-123
          # Required by docker-compose.yml since the UI sign-in gate (audit
          # issue #5, Option B): ${VAR:?...} makes `docker compose config` fail
          # without them, even when only the infra services are started.
          SEAMTECH_UI_PASSWORD: ci-ui-password
          SEAMTECH_SESSION_SECRET: ci-session-secret-not-for-production
        run: |
          # Validate interpolation/schema up front so a config error fails
          # here with a clear message instead of deep in `up`.
          docker compose config --quiet
          if ! out=$(docker compose up -d postgres redis minio 2>&1); then
            echo "$out"
            # Surface the real failure in the run annotations as well.
            echo "::error title=compose-up-failed::$(echo "$out" | tail -15 | tr '\n' ' | ')"
            exit 1
          fi
          docker compose ps
      - name: Wait for services to be reachable
        # Hard wait with a real timeout, probing each backend the same way the
        # app does (psycopg2 / redis-py / the MinIO liveness endpoint). If a
        # service never comes up, the job fails here with its logs instead of
        # the integration suite silently skipping.
        env:
          POSTGRES_PASSWORD: test_password
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
          REDIS_PASSWORD: redis_test_password
          SEAMTECH_AUTH_TOKEN: test-token-123
          SEAMTECH_UI_PASSWORD: ci-ui-password
          SEAMTECH_SESSION_SECRET: ci-session-secret-not-for-production
        run: |
          python - << 'PY'
          import subprocess
          import sys
          import time
          import urllib.request

          deadline = time.time() + 300
          state = {}

          def probe_postgres() -> bool:
              import psycopg2

              conn = psycopg2.connect(
                  "postgresql://seamtech:test_password@127.0.0.1:5433/seamtech_search",
                  connect_timeout=3,
              )
              conn.close()
              return True

          def probe_redis() -> bool:
              import redis

              return redis.from_url("redis://:redis_test_password@127.0.0.1:6379/0", socket_connect_timeout=3, socket_timeout=3).ping()

          def probe_minio() -> bool:
              with urllib.request.urlopen("http://127.0.0.1:9000/minio/health/live", timeout=3) as resp:
                  return resp.getcode() == 200

          probes = {"postgres": probe_postgres, "redis": probe_redis, "minio": probe_minio}
          while True:
              for name, probe in probes.items():
                  if state.get(name):
                      continue
                  try:
                      state[name] = bool(probe())
                  except Exception:
                      state[name] = False
              if all(state.values()):
                  print("All services reachable:", state)
                  break
              if time.time() > deadline:
                  print(f"Services not reachable in time: {state}", file=sys.stderr)
                  subprocess.run(["docker", "compose", "logs", "--tail", "50"])
                  sys.exit(1)
              time.sleep(5)
          PY
      - name: Boot documented stack (web + frontend) and wait for healthy
        # Prove the one-command office deployment, not only the individual
        # images. Both application services must report healthy before the
        # browser-facing health route is checked through the real chain.
        env:
          POSTGRES_PASSWORD: test_password
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
          REDIS_PASSWORD: redis_test_password
          SEAMTECH_AUTH_TOKEN: test-token-123
          # Required by docker-compose.yml since the UI sign-in gate (audit
          # issue #5, Option B): ${VAR:?...} makes `docker compose config` fail
          # without them, even when only the infra services are started.
          SEAMTECH_UI_PASSWORD: ci-ui-password
          SEAMTECH_SESSION_SECRET: ci-session-secret-not-for-production
          SEAMTECH_S3_BUCKET: seamtech-documents
        run: |
          set -euo pipefail
          if ! out=$(docker compose up -d --build web frontend 2>&1); then
            echo "$out"
            echo "::error title=full-stack-boot-failed::$(echo "$out" | tail -20 | tr '\n' ' | ')"
            docker compose ps
            web_logs=$(docker compose logs --no-color --tail 120 web 2>&1 || true)
            echo "$web_logs"
            front_logs=$(docker compose logs --no-color --tail 60 frontend 2>&1 || true)
            echo "$front_logs"
            # The compose output above says *that* web is unhealthy but never why.
            # Its own logs are the only thing that explains a crash loop, so
            # repeat them as annotations where they stay readable.
            echo "::error title=web-container-logs::$(echo "$web_logs" | tail -40 | tr '\n' ' | ')"
            echo "::error title=frontend-container-logs::$(echo "$front_logs" | tail -20 | tr '\n' ' | ')"
            exit 1
          fi

          deadline=$((SECONDS + 300))
          while true; do
            all_healthy=1
            unhealthy=""
            for service in web frontend; do
              container=$(docker compose ps -q "$service")
              if [ -z "$container" ]; then
                all_healthy=0
                unhealthy="$unhealthy $service (not created)"
                continue
              fi
              health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container")
              state=$(docker inspect --format '{{.State.Status}}' "$container")
              case "$health" in
                healthy)
                  ;;
                unhealthy|dead|exited)
                  echo "${service}: state=${state} health=${health}"
                  unhealthy="$unhealthy $service (state=${state}, health=${health})"
                  all_healthy=0
                  ;;
                *)
                  all_healthy=0
                  ;;
              esac
            done

            if [ "$all_healthy" -eq 1 ]; then
              echo "web and frontend are healthy"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "full-stack boot timed out or became unhealthy:$unhealthy" >&2
              docker compose ps >&2
              logs=$(docker compose logs --no-color --tail 100 web frontend 2>&1)
              echo "$logs" >&2
              echo "::error title=full-stack-health-failed::$(echo "$logs" | tail -30 | tr '\n' ' | ')"
              exit 1
            fi
            sleep 5
          done

          if ! curl -fsS http://127.0.0.1:3000/api/health; then
            echo >&2
            logs=$(docker compose logs --no-color --tail 100 web frontend 2>&1)
            echo "$logs" >&2
            echo "::error title=frontend-health-route-failed::$(echo "$logs" | tail -30 | tr '\n' ' | ')"
            exit 1
          fi
          echo
      - name: Run docker compose integration test
        env:
          POSTGRES_PASSWORD: test_password
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
          REDIS_PASSWORD: redis_test_password
          SEAMTECH_AUTH_TOKEN: test-token-123
          # Required by docker-compose.yml since the UI sign-in gate (audit
          # issue #5, Option B): ${VAR:?...} makes `docker compose config` fail
          # without them, even when only the infra services are started.
          SEAMTECH_UI_PASSWORD: ci-ui-password
          SEAMTECH_SESSION_SECRET: ci-session-secret-not-for-production
          SEAMTECH_S3_BUCKET: seamtech-documents
          # CI guarantees the infra is healthy above: the test must not swallow
          # failures of backends that are supposed to be up.
          SEAMTECH_INTEGRATION_STRICT: "1"
        run: |
          # Infra is bound to 127.0.0.1 by docker-compose.yml, so point the
          # test at those ports (same host, same loopback).
          export SEAMTECH_REDIS_URL="redis://:redis_test_password@127.0.0.1:6379/0"
          export SEAMTECH_S3_ENDPOINT_URL="http://127.0.0.1:9000"
          export SEAMTECH_S3_ACCESS_KEY="minioadmin"
          export SEAMTECH_S3_SECRET_KEY="minioadmin123"
          set +e
          pytest tests/test_integration_docker.py -v
          rc=$?
          set -e
          # Always tear the infra down, success or failure.
          docker compose down -v
          exit "$rc"

  e2e:
    runs-on: ubuntu-latest
    # Service PostgreSQL pour l'e2e « live » (validation sur la vraie fiche) :
    # même image que le job backend — l'utilisateur est superutilisateur, ce
    # qui autorise le seed à créer/recréer la base jetable e2e_*.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: seamtech
          POSTGRES_PASSWORD: seamtech_test_password
          POSTGRES_DB: seamtech_search_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests (suite par défaut, SQLite)
        working-directory: frontend
        run: pnpm test:e2e
      # Clôture Phase 1 (Tâche 2 du 21/09) : le parcours de validation est
      # rejoué EN CONDITIONS RÉELLES — base PostgreSQL jetable, trois dossiers
      # déposés par le pipeline (dont la vraie fiche 7792-SO), front de
      # production (next start). Sans SEAMTECH_E2E_DATABASE_URL la spec
      # validation s'ignorait : la porte Playwright ne prouvait rien sur le
      # document réel. Le chrono « ouverture → validation < 2 min » (§17.14)
      # est publié en annotation du test (mesure-phase1).
      - name: Build production frontend (mode live = next start)
        working-directory: frontend
        run: pnpm build
      - name: Run live E2E validation (PostgreSQL + vraie fiche)
        working-directory: frontend
        env:
          SEAMTECH_E2E_DATABASE_URL: postgresql://seamtech:seamtech_test_password@localhost:5432/seamtech_search_test
          # Le reporter « json » passé en CLI écrit sur STDOUT par défaut ;
          # c'est cette variable qui le fait écrire dans un fichier (doc
          # Playwright). Sans elle, report.json n'existe pas et le parseur
          # ci-dessous échoue (mesuré au run 35665977190, étape de 6 s verte
          # côté tests).
          PLAYWRIGHT_JSON_OUTPUT_NAME: report.json
        run: |
          # --reporter=list,json : le reporter « list » n'imprime JAMAIS les
          # annotations de test (vérifié par banc minimal le 22/09) ; le chrono
          # du parcours machine complet (annotation mesure-phase1) est donc
          # extrait du rapport JSON et publié en ::notice — c'est le seul
          # mécanisme qui le rende lisible dans les journaux CI. Garde-fous de
          # porte de sortie de phase : 3 passés au premier essai, 0 flaky (un
          # échec rattrapé par retry fait échouer la porte), 0 saut, et le
          # chrono doit avoir été produit.
          set -uo pipefail
          set +e
          pnpm exec playwright test e2e/validation.spec.ts --reporter=list,json
          rc=$?
          set -e
          [ "$rc" -eq 0 ] || exit "$rc"
          python - <<'PY'
          import json
          import os

          if not os.path.exists("report.json"):
              raise SystemExit(
                  "GARDE-FOU live e2e : report.json absent — PLAYWRIGHT_JSON_OUTPUT_NAME "
                  "doit être positionné pour que le reporter json écrive un fichier."
              )
          d = json.load(open("report.json"))

          def iterer_specs(suite):
              yield from suite.get("specs", [])
              for enfant in suite.get("suites", []):
                  yield from iterer_specs(enfant)

          stats = d["stats"]
          passes = stats["expected"]
          flaky = stats.get("flaky", 0)
          sautes = stats.get("skipped", 0)
          # Porte de sortie de phase (audit indépendant du 22/09) : un test qui
          # échoue puis passe au retry (compté « flaky » par Playwright avec
          # retries: 2) n'est PAS un test réellement assaini — il doit faire
          # échouer la porte, pas compter comme « réellement exécuté ».
          if sautes or flaky or passes != 3:
              raise SystemExit(
                  f"GARDE-FOU live e2e : attendu 3 tests passés au premier essai, "
                  f"0 flaky, 0 sautés — mesuré {passes} passés, {flaky} flaky, "
                  f"{sautes} sautés. Les tests live ne doivent jamais s'ignorer "
                  "silencieusement ni masquer une instabilité par retry."
              )
          mesures = [
              a
              for s in d["suites"]
              for spec in iterer_specs(s)
              for t in spec.get("tests", [])
              for a in t.get("annotations", [])
              if a.get("type") == "mesure-phase1"
          ]
          if not mesures:
              raise SystemExit(
                  "GARDE-FOU chrono : annotation mesure-phase1 absente — le chrono "
                  "du parcours machine complet de la vraie fiche n'a pas été produit."
              )
          print("::notice title=mesure-phase1::" + mesures[0]["description"])
          PY

  sauvegarde:
    # Lot H.1 — ALLER-RETOUR ÉPROUVÉ : sauvegarde hors-site (MinIO réel),
    # base RÉELLEMENT détruite (DROP DATABASE), puis reconstruite DEPUIS LE
    # BUCKET SEUL. La preuve d'égalité est exécutée : comptes par table,
    # VERSION_SCHEMA_METIER, recherche fonctionnelle, inventaire d'archive.
    # La durée de restauration sur ~50 000 fiches est MESURÉE et publiée en
    # ::notice (chiffre repris dans RUNBOOK_RESTAURATION.md).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: seamtech
          POSTGRES_PASSWORD: seamtech_test_password
          POSTGRES_DB: seamtech_search_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # MinIO n'est PAS un service GitHub : l'image serveur exige la commande
      # explicite `server /data` (docker-compose.yml la fixe aussi), et un
      # conteneur de service ne peut pas recevoir de commande — échec observé
      # au run push 35730395548 (« Failed to initialize container »). MinIO
      # est donc démarré par une étape dédiée, comme le fait le job
      # integration via compose. (minio/minio a été retiré de Docker Hub le
      # 2026-09-11 : quay.io/minio est la distribution officielle.)
    env:
      SEAMTECH_TEST_DATABASE_URL: postgresql://seamtech:seamtech_test_password@127.0.0.1:5432/seamtech_search_test
      SEAMTECH_S3_ENDPOINT_URL: http://127.0.0.1:9000
      SEAMTECH_S3_BUCKET: seamtech-backups
      SEAMTECH_S3_ACCESS_KEY: minioadmin
      SEAMTECH_S3_SECRET_KEY: minioadmin123
      SEAMTECH_S3_PREFIX: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Start MinIO (bucket hors-site réel)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          python - << 'PY'
          import sys
          import time
          import urllib.request

          # Même sonde que le job integration : l'endpoint de vivacité MinIO,
          # depuis l'hôte (le conteneur publie 9000 sur le runner).
          deadline = time.time() + 120
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:9000/minio/health/live", timeout=3) as resp:
                      if resp.getcode() == 200:
                          print("MinIO vivant")
                          sys.exit(0)
              except Exception:
                  pass
              time.sleep(2)
          print("::error title=minio-not-ready::MinIO n'a pas répondu sur /minio/health/live en 120 s")
          sys.exit(1)
          PY
      - name: Prepare config file (S3 env overrides apply on top)
        run: cp config/config.example.json config/config.json
      - name: Create the off-site backups bucket
        run: |
          python - << 'PY'
          import boto3

          client = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:9000",
              aws_access_key_id="minioadmin",
              aws_secret_access_key="minioadmin123",
          )
          client.create_bucket(Bucket="seamtech-backups")
          print("bucket seamtech-backups créé")
          PY
      - name: Run the backup round-trip suite (sauver → détruire → restaurer)
        env:
          SEAMTECH_SAUVEGARDE_JSON: sauvegarde-mesures.jsonl
        run: |
          python -m pytest tests/test_sauvegarde_unites.py tests/test_sauvegarde_restauration.py \
            -m "postgres or sauvegarde" -v --junitxml=sauvegarde-junit.xml
      - name: GARDE-FOU — every round-trip test ran, none skipped
        run: |
          python - << 'PY'
          import xml.etree.ElementTree as ET

          racine = ET.parse("sauvegarde-junit.xml").getroot()
          testsuite = racine if racine.tag == "testsuite" else racine.find("testsuite")
          passes = int(testsuite.get("tests", 0)) - int(testsuite.get("failures", 0)) - int(testsuite.get("errors", 0)) - int(testsuite.get("skipped", 0))
          sautes = int(testsuite.get("skipped", 0))
          echecs = int(testsuite.get("failures", 0)) + int(testsuite.get("errors", 0))
          print(f"sauvegarde : {passes} passés, {sautes} sautés, {echecs} échecs")
          # Attendu : 12 tests unitaires + 7 tests d'aller-retour réel.
          # Un test sauté ici signifierait que l'épreuve hors-site ne s'est PAS
          # exécutée contre MinIO — la porte doit échouer, pas verdir en silence.
          if echecs or sautes or passes < 19:
              raise SystemExit(
                  "GARDE-FOU sauvegarde : attendu ≥ 19 tests passés, 0 sautés, 0 échecs — "
                  f"mesuré {passes} passés, {sautes} sautés, {echecs} échecs. "
                  "L'aller-retour sauvegarde → destruction → restauration doit être "
                  "prouvé par exécution, jamais sauté."
              )
          PY
      - name: Publish measured durations (runbook figures)
        env:
          SEAMTECH_SAUVEGARDE_JSON: sauvegarde-mesures.jsonl
        run: |
          python - << 'PY'
          import json
          import pathlib

          chemin = pathlib.Path("sauvegarde-mesures.jsonl")
          if not chemin.exists() or not chemin.read_text(encoding="utf-8").strip():
              raise SystemExit(
                  "GARDE-FOU sauvegarde : aucune mesure publiée — la restauration "
                  "n'a pas été exécutée jusqu'au bout."
              )
          lignes = [json.loads(brut) for brut in chemin.read_text(encoding="utf-8").splitlines()]
          if not any(l.get("scenario") == "50k_fiches" for l in lignes):
              raise SystemExit("GARDE-FOU sauvegarde : la mesure 50 000 fiches est absente.")
          for ligne in lignes:
              if ligne.get("scenario") == "50k_fiches":
                  print(
                      f"::notice title=sauvegarde-restauration-50k::"
                      f"restauration de {ligne['nb_fiches']} fiches en {ligne['duree_s']} s "
                      f"(dump {ligne['dump_octets']} octets) — chiffre publié dans RUNBOOK_RESTAURATION.md"
                  )
              elif ligne.get("operation") == "restaurer" and ligne.get("base"):
                  print(
                      f"::notice title=sauvegarde-restauration::{ligne['base']} restaurée en "
                      f"{ligne['duree_s']} s ({ligne.get('fiches', '?')} fiches)"
                  )
              elif ligne.get("operation") == "sauver":
                  print(
                      f"::notice title=sauvegarde-envoi::dump {ligne['dump_octets']} octets en "
                      f"{ligne['duree_s']} s, archive {ligne['archive_fichiers']} fichiers, "
                      f"vérifié après envoi : {ligne['verifiee_apres_envoi']}"
                  )
          PY
